name: lpshipit # you probably want to 'snapcraft register <name>'
version: '0.5.2' # just for humans, typically '1.2+git' or '1.3.2'
base: core24
summary: Helpful utility for merging and testing launchpad MPs # 79 char long summary
description: |
  Helpful utility for merging and testing launchpad MPs (only works for git repos)

grade: stable
confinement: classic
environment:
    LC_ALL: C.UTF-8
    LANG: C.UTF-8

parts:
  lpshipit:
    plugin: python
    source: .
    source-type: git
    build-packages:
      - python3-venv
    stage-packages:
      - python3.12-minimal
      - python3-venv
    python-packages:
      - launchpadlib

apps:
  lpshipit:
    environment:
      PYTHONPATH: $SNAP/lib/python3.12/site-packages:$PYTHONPATH
    command: bin/lpshipit
  lpmpmessage:
    environment:
      PYTHONPATH: $SNAP/lib/python3.12/site-packages:$PYTHONPATH
    command: bin/lpmpmessage
  lpmptox:
    environment:
      PYTHONPATH: $SNAP/lib/python3.12/site-packages:$PYTHONPATH
    command: bin/lpmptox

